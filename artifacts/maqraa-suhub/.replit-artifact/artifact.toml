kind = "web"
previewPath = "/"
title = "مقرأة سُحُب"
description = "منصة راقية لإدارة مقرأة قرآنية داخلية، تربط الطلاب والمعلمين والإدارة لمتابعة الحضور والإنجاز والتقدم في مكان واحد."
version = "1.0.0"
id = "artifacts/maqraa-suhub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21588

[services.development]
run = "pnpm --filter @workspace/maqraa-suhub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maqraa-suhub", "run", "build" ]
serve = "static"
publicDir = "artifacts/maqraa-suhub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21588"
BASE_PATH = "/"
